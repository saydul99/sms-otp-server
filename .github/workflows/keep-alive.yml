name: Keep Server Alive

on:
  schedule:
    - cron: '*/5 * * * *'  # Har 5 minute pe ping - Render ko sone nahi dega
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Render Server
        run: |
          for i in 1 2 3; do
            curl -sf https://sms-otp-server.onrender.com/status && break
            echo "Retry $i..."
            sleep 10
          done
